openapi: '3.0.3'
info:
  title: LeCow Spec
  description: In progress API Spec for LeCow App, subject to change. Currently does not have Auth spec
  version: '1.0'
servers:
  - url: http://localhost:3000/api/v1
paths:
  /users:
    get:
      description: Get all users
      tags:
        - users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      description: Creates a new user
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NewUser'
              required:
                - name
                - email
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
  /users/{id}/balance:
    get:
      description: Get user balance across all groups, positivalues means in favor, negative values means in debt
      tags:
        - balance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
              examples:
                favor:
                  description: has credit
                  value:
                    balance: 999.99
                debt:
                  description: has debt
                  value:
                    balance: -999.99
                even:
                  description: No credit nor debt
                  value:
                    balance: 0.0
  /users/{id}/groups:
    get:
      description: get all groups where user belongs to with balance
      tags:
        - balance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Group'
                  - type: object
                    properties:
                      balance:
                        description: Balance within the group.
                        type: number
  /groups:
    get:
      description: Get all groups
      tags:
        - groups
      responses:
        '200':
          description: OK
    post:
      description: Create a group
      tags:
        - groups
      responses:
        '201':
          description: Created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NewGroup'
              required:
                - name
  /groups/members/{groupId}:
    get:
      description: Get all members of a group
      tags:
        - members
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
         
        '404':
          description: Group does not exist

  /groups/members:
    post:
      description: Add a user to a group
      tags:
        - members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: integer
                userId:
                  type: integer
              required:
                - groupId
                - userId
      responses:
        '201':
          description: User added to group
        '409':
          description: User already added
        '404':
          description: Group or User does not exist

  /expenses:
     post:
      description: Create an expense in the group
      tags:
        - expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExpense'
      responses:
        '201':
          description: Expense created
components:
  schemas:
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    NewUser:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      example:
        name: Some Rabbit
        email: somerabbit@example.com
    User:
      allOf:
        - type: object
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/NewUser'
      example:
        id: 1
        name: rabbit
        email: rabbit@example.com
    NewGroup:
      type: object
      properties:
        name:
          type: string
      example:
        name: Some Group
    Group:
      allOf:
        - type: object
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/NewGroup'
    NewExpense:
      type: object
      properties:
        groupId:
          type: integer
        userId:
          type: integer
        expenseName:
          type: string
        amount:
          type: number
        paidByUserId:
          type: integer
        participants:
          description: List of participant user objects
          type: array
          items:
            type: object
            properties:
              userId:
                type: integer
          minItems: 1
      required:
        - groupId
        - userId
        - expenseName
        - amount
        - paidByUserId
        - participants
      example:
        groupId: 1
        userId: 1
        expenseName: 'salida al parque'
        amount: 60000
        paidByUserId: 1
        participants:
          - userId: 1
          - userId: 2
          - userId: 3